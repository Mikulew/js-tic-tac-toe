<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Vanilla JavaScript Tic Tac Toe</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css"href="style.css" />
    <script type="module" src="main.js"></script>
  </head>

  <body>
    <section id="menu" class="container">
      <h1 class="title">Tic Tac Toe</h1>
      <h2 class="title">
        XOX<br/>OXO<br/>XOX
      </h2>
      <div class="wrapper">
        <div class="wrapper action-wrapper">
          <button id="secondPlayer" class="action-button">2 player game</button>
          <button id="computerPlayer" class="action-button" disabled>Play with computer</button>
        </div>
      </div>
    </section>

    </section>
    <section id="gameboard" class="container hide">
      <h1 class="title">Your turn</h1>
      <p>Work in progress</p>
      <div class="wrapper action-wrapper">
        <button id="abortGame" class="action-button">Abort game</button>
      </div>
    </section>
  </body>
</html>
