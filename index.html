<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Vanilla JavaScript Tic Tac Toe</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <section id="menu" class="container">
      <h1 class="title">Tic Tac Toe</h1>

        <div class="wrapper">
          <div class="gameboard presentation">
            <div class="cell x"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell o"></div>
            <div class="cell o"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell x"></div>
          </div>
      </div>

      <div class="wrapper">
        <div class="wrapper action-wrapper">
          <button id="secondPlayer" class="action-button" type="button">2 player game</button>
          <button id="computerPlayer" class="action-button" type="button">Play with computer</button>
        </div>
      </div>
    </section>

    <section id="gameboard" class="container hide">
      <h1 class="title turn-title ">X's turn</h1>

      <div class="wrapper">
        <div id="playground" class="gameboard x">
          <div class="cell" data-cell></div>
          <div class="cell" data-cell></div>
          <div class="cell" data-cell></div>
          <div class="cell" data-cell></div>
          <div class="cell" data-cell></div>
          <div class="cell" data-cell></div>
          <div class="cell" data-cell></div>
          <div class="cell" data-cell></div>
          <div class="cell" data-cell></div>
        </div>
      </div>

      <div class="wrapper action-wrapper">
        <button id="abortGame" class="action-button" type="button">Abort game</button>
        <button id="restartGame" class="action-button" type="button">Restart game</button>
      </div>
    </section>

    <section id="settings" class="container hide">
      <h1 class="title">Game settings</h1>

      <form id="form" class="settings-form">
        <fieldset class="form-field">
          <legend class="subtitle">Select the starting mark</legend>
          <select class="select" id="selectedMark" name="selectedMark" required>
            <option value="X">X – cross</option>
            <option value="O">O – naught</option>
          </select>
        </fieldset>

        <fieldset class="form-field">
          <legend class="subtitle">Select the starting player</legend>
          <select class="select" id="firstMove" name="firstMove" required>
            <option value="PLAYER">Player</option>
            <option value="COMPUTER">Computer</option>
          </select>
        </fieldset>

        <fieldset class="form-field">
          <legend class="subtitle">Select the game difficulty</legend>
          <select class="select" id="gameDifficulty" name="gameDifficulty" required>
            <option value="BASIC">1 – basic</option>
            <option value="ADVANCED">2 – advanced</option>
          </select>
        </fieldset>
      </form>

      <div class="wrapper action-wrapper">
        <button id="cancel" class="action-button" type="button">Cancel</button>
        <button id="playGame" class="action-button" type="button">Play</button>
      </div>
    </section>
  </body>
</html>
